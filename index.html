<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <div class="container">
        <div class="left-pane">
            <div class="overlay"></div>

            <div class="logo">
                <img src="https://imgs.search.brave.com/8QJ3s62ZSKJz8ZwCeh_8POQzxlZp4CciJRGwUSfGBt8/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9jbXMu/Y2xvdWRpbmFyeS52/cHN2Yy5jb20vaW1h/Z2UvdXBsb2FkL2Nf/c2NhbGUsZHByX2F1/dG8sZl9hdXRvLHdf/YXV0by92aXN0YS1s/b2dvcy1wYWdlcy9l/bi1VUy9sb2dvbWFr/ZXItZ2VuLWFpL2xv/Z28tZXhhbXBsZXMv/cmV0YWlsL2dyZWVu/LndlYnA"
                    alt="logo">
                <p>Basket</p>
            </div>
            <p class="credit">Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a
                    href="https://unsplash.com/">Unsplash</a></p>
        </div>


        <div class="right-pane">
            <div class="text">
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize
                    your deepest dreams. Sign up now to get started.</p>
                <p>You know you want to</p>
            </div>

            <form action="#" method="get">
                <h2>Let's do this!</h2>

                <div class="form-grid">
                    <div>
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" id="first_name" name="first_name">
                    </div>

                    <div><label for="last_name">LAST NAME</label>
                        <input type="text" id="last_name" name="last_name">
                    </div>

                    <div>
                        <label for="user_email">EMAIL</label>
                        <input type="email" id="user_email" name="user_email" required>
                    </div>

                    <div>
                        <label for="user_phone">PHONE NUMBER</label>
                        <input type="number" id="user_phone" name="user_phone">
                    </div>

                    <div>
                        <label for="user_password">PASSWORD</label>
                        <input type="password" id="user_password" name="user_password">
                    </div>

                    <div>
                        <label for="retype_password">CONFIRM PASSWORD</label>
                        <input type="password" id="retype_password" name="retype_password">
                    </div>
                </div>

                <button type="submit">Create Account</button>
            </form>

            <p>Already have an account? <a href="#">Log in</p>
        </div>
    </div>
</body>

</html>
